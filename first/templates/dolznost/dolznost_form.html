<h1>
    {% if form.instance.pk %}
        Редактировать должность
    {% else %}
        Добавить должность
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'dolznost_list' %}">Вернуться к списку должностей</a>
