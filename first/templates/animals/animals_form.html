<h1>
    {% if form.instance.pk %}
        Редактировать животное
    {% else %}
        Добавить животное
    {% endif %}
</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'animals_list' %}">Вернуться к списку животных</a>
